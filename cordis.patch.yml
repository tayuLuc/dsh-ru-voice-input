# dsh-ru-voice-input bundle layer.
#
# One install gives a composer microphone that already understands Russian.
#
# The layer order is the application order (app-boot: readProfilePatches
# concatenates bundle patches in dsh.profile.bundles order, then the profile
# patch, then home/overlays; composeEntries folds them in one applyEntryPatches
# pass). Two rules of that fold decide every row shape below (read from the
# app-boot 0.2.1-rc.4 source and measured live 30.10, `dsh --dump-config`
# warnings — this exact file lost three times to not knowing them):
#   - `name` on a row is a MISMATCH GUARD, never a rename: a row whose name
#     differs from the module the id already holds is skipped;
#   - a row for an id no earlier layer inserted is "not found"; only the
#     nameless `{insert: [...]}` append runs unconditionally.
# The stock voice bundle is listed AFTER ours, so a named row of ours for a
# stock id (ui-voice-input, sensevoice) is always a preview for its own
# entries and never overrides theirs; the profile's own user patch applies
# after every bundle and is the legal override layer (that is where the
# operator's Settings toggles live).
#
#   1. speech-to-text: the id belongs to the stock voice bundle when that
#      bundle is installed (its layer applies after ours; the fold skips a
#      named row whose name clashes with the entry the id holds), so in a
#      stock-bundle profile the STOCK registry runs and the profile's user
#      patch carries the selection config (a nameless config-only row merges
#      by id). Where no stock bundle exists, the insert below mounts our fork
#      (contract-fork of the registry + configure() provider-switch fix +
#      live-set/persist-attempt write).
#   2. the default recognizer is the local Russian GigaAM v3 CTC provider, and
#      the default language is ru, so a fresh profile works with no clicks.
#   3. SenseVoice is absent by design: it ships no Russian, and its 239 MB
#      download is not a cost a Russian profile should pay.
#
# Rows 1 and 2 use relative module specifiers, which the loader resolves inside
# this package. That is what makes the bundle self-contained: a git-installed
# package cannot depend on its own subdirectories, so the forks must live here.
# The registry id belongs to the stock voice bundle in a profile that installs
# it (its layer applies after ours; a named row of ours for that id is skipped
# by the fold — measured 30.10). The stock rc.4 registry is the mount there:
# it gained provider configure() (the historic fork fix is moot) and the
# selection persistence rides the host's volatile path. The fork insert below
# is scoped to a fresh profile WITHOUT the stock bundle: the insert creates the
# entry when nobody owns the id; there the fork is the mount, so it must select
# GigaAM itself — that is the provider's `setAsDefaultProvider` config below
# (the stock registry's own defaults name `sensevoice-local`, which exists
# only in the stock bundle).
- insert:
    - id: speech-to-text
      name: ./lib/registry.js
      config:
        defaultProvider: gigaam-v3-ctc-local
        language: ru
    - id: speech-to-text-gigaam
      name: ./lib/gigaam/index.js
      # Self-select at mount: the registry defaults to a provider that is not
      # registered in this bundle, so a fresh install would boot with a dead
      # selection and the mic UI's "Speech recognition is not ready" card.
      # Idempotent (configuring to the same selection) and best-effort (a
      # rejected write is a warn, the mount survives).
      # Written out in full so the provider's settings card materialises every
      # knob instead of showing a blank one. The values are the schema defaults:
      # edit them here, or from the plugin details, to pin a different engine,
      # model, quant or execution provider.
      config:
        setAsDefaultProvider: true
        engine: auto
        e2eModel: ctc
        ortModel: gigaam-v3-e2e-ctc
        ortProviders: CPUExecutionProvider
        e2ePythonPath: ''
        backend: metal
        threads: 2
        idleTimeoutMs: 120000
        lexiconPath: ''
        lexiconThreshold: 0.8


